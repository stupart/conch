name: ci

# 2026-09-17: GitHub Actions credits ran out, so this no longer runs on push or
# pull_request — nothing in the cloud checks a commit any more. The gate is
# scripts/ci-local.sh: it runs every step below plus the Mac and iOS builds,
# which this file never had, and scripts/install-hooks.sh makes pre-push run it.
# Kept as workflow_dispatch rather than deleted so the jobs can still be run by
# hand when there are credits again, and so the old triggers are a two-line
# restore (`push: branches: [main]` and `pull_request:` under `on:`).
#
# There was no CI. That is how a red main got merged on 2026-08-31: the suite
# was piped into `tail`, the exit code went unread, and nothing downstream
# disagreed. A human reading output is not a gate.
on:
  workflow_dispatch:

jobs:
  test:
    # macOS because conch shells out to macOS binaries throughout, and the
    # tests read real process trees. A linux runner would be green for reasons
    # that say nothing about whether conch works.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: tests
        run: bun test
      # Separate step, and not optional: `bun test` does not typecheck, and the
      # daemon's largest function is executed by no test at all — so tsc is the
      # only automated thing that reads it the way the runtime does. It has
      # already caught a refactor that moved a function without exporting it
      # while all 1138 tests passed.
      - name: typecheck
        run: bunx tsc --noEmit
      # The design system's own tests: springs, overlay geometry and motion, look, text pinning. Without
      # this step a green check said nothing about any Swift. The Mac app's xcodebuild isn't here yet.
      - name: design system tests
        run: swift test --package-path design/ConchDesign

  # Staleness has to be visible somewhere, or it is only discovered by a user
  # installing software that does not work. This does not fail the build — being
  # ahead of a release is normal — it just makes the gap impossible to not know.
  release-gap:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: how far is the tap behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then echo "::warning::no release published yet"; exit 0; fi
          AHEAD=$(git rev-list --count "$TAG"..HEAD)
          echo "main is $AHEAD commits ahead of $TAG"
          if [ "$AHEAD" -gt 25 ]; then
            echo "::warning::main is $AHEAD commits ahead of $TAG — anyone installing from Homebrew is getting $TAG"
          fi
          echo "main is **$AHEAD commits** ahead of \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
